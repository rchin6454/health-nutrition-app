# Curated food names → food IDs (architecture §5.4, step 1).
#
# English, Hindi and regional names for common Indian foods. Curated synonyms win over the names
# build_synonyms.py derives from the datasets themselves (IFCT food names and IFCT's local-name
# column), so this file is where ambiguity is settled: e.g. "rice" means raw milled rice
# (ifct:A015), not one of the six other IFCT rice entries.
#
# Each name may appear under one food only. The understanding step normalizes names to English
# ("chawal" → "cooked rice", "palak" → "spinach"), so both forms are listed.
#
# Raw vs cooked: IFCT describes raw foods. Names for the cooked dish ("cooked rice", "roti",
# "dal") point to the USDA cooked entries; names for the ingredient point to IFCT.

