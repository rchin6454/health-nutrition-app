# USDA FoodData Central fallback foods (architecture §10.1).
#
# IFCT 2017 is the primary source but covers raw foods only. These are the cooked dishes and
# common foods it does not have. Only the FDC IDs listed here are loaded, so fuzzy name matching
# can never drift onto an unrelated USDA food.
#
#   fdc_id:     FoodData Central ID (SR Legacy or FNDDS survey food)
#   name:       display name used in facts (the USDA description is often US-specific)
#   state:      raw | cooked | null (neither applies, e.g. curd, honey)
#   diet:       veg | egg | nonveg
#   food_group: free text, for audit only (USDA foods are never used for recommendation lists)
#
# Synonyms for these foods live in synonyms.yaml under "usda:<fdc_id>".

