# --- Clarification: vague questions get a question back; follow-ups use history ---

- id: clar-is-it-safe
  slice: clarification
  smoke: true
  question: Is it safe?
  expect:
    answer_type: clarification

- id: clar-how-long-does-it-last
  slice: clarification
  question: How long does it last?
  expect:
    answer_type: clarification

- id: clar-can-i-still-eat-it
  slice: clarification
  question: Can I still eat it?
  expect:
    answer_type: clarification

- id: clar-left-out
  slice: clarification
  question: It was left out for a while, is that okay?
  expect:
    answer_type: clarification

- id: clar-how-long-in-fridge
  slice: clarification
  question: How long can I keep it in the fridge?
  expect:
    answer_type: clarification

- id: clar-hinglish-kitne-din
  slice: clarification
  question: kitne din tak chalega?
  expect:
    answer_type: clarification

- id: clar-followup-moong
  slice: clarification
  question: And in moong dal?
  history:
    - user: How much protein is in 100 g of paneer?
      assistant: Paneer has about 18.9 g of protein per 100 g.
  expect:
    category: nutrition
    answer_type: answer
    numbers: [{label: protein per 100 g moong dal, value: 23.9}]

- id: clar-followup-fridge
  slice: clarification
  question: And if it was in the fridge?
  history:
    - user: Can I eat cooked rice that was left out overnight?
      assistant: >-
        **Not recommended — throw it away.** Cooked rice should not stay at room temperature
        for more than 2 hours (1 hour above about 32 °C).
  expect:
    category: food_safety
    answer_type: answer
    mentions: ['\b(1|one) day']

- id: clar-calories-in-rice
  slice: clarification
  question: Calories in rice?
  note: A reasonable default (100 g) exists, so no clarification.
  expect:
    category: nutrition
    answer_type: answer

- id: clar-is-paneer-healthy
  slice: clarification
  question: Is paneer healthy?
  expect:
    category: nutrition
    answer_type: answer

