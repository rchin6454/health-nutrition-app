# Eval cases (architecture §12). Run with: uv run python -m tests.evals.run_evals
#
# Expected numbers are the values in the knowledge tables (IFCT 2017 first, curated USDA for
# dishes), as the knowledge lookup returns them for that food and amount; checked within ±5%.
# Regexes are case-insensitive and run over the answer text plus every claim, with non-breaking
# and thin spaces read as plain spaces.
#
# Every case also gets the schema, source == null and no-warnings checks (see checks.py).
# Cases marked `smoke: true` are the subset CI runs when prompts, schemas or gates change.
# When a production failure is fixed, add a case for it here with a `note`.

# --- Classification: the five problem-statement examples, Hinglish, mixed, general food ---

- id: cls-brown-vs-white-rice
  slice: classification
  smoke: true
  question: Is brown rice healthier than white rice?
  expect:
    category: nutrition
    answer_type: answer
    numbers: [{label: fibre per 100 g brown rice, value: 4.43}]
    mentions: ['fib(re|er)']

- id: cls-hinglish-paneer-protein
  slice: classification
  question: paneer mein kitna protein hota hai?
  expect:
    category: nutrition
    answer_type: answer
    numbers: [{label: protein per 100 g paneer, value: 18.9}]

- id: cls-hinglish-chawal-safety
