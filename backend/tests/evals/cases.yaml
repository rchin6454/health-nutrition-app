# --- Food safety: verdict first, limits from the rules, hot-climate rule ---

- id: fs-rice-overnight
  slice: food_safety
  smoke: true
  question: Can I eat cooked rice that was left outside overnight?
  note: >-
    Phase 4 live run: the answer added "a closed fridge will keep food safe for up to 2 days",
    which is not in its context (the cooked-rice fridge limit is 1 day).
  expect:
    category: food_safety
    answer_type: answer
    verdict: discard
    mentions: ['32\s?°?\s?C|1 hour']
    forbid: ['\b(2|two|3|three) days\b']

