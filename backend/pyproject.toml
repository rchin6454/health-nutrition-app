[project]
name = "food-nutrition-backend"
version = "0.1.0"
description = "FastAPI backend for the India-first food, nutrition and food-safety chatbot"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.7",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
# Offline ingestion scripts: one connection, run by hand, so blocking file reads are fine.
"scripts/ingest/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pgserver>=0.1.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
